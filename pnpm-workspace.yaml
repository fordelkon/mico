engineStrict: true

allowBuilds:
  electron: true
  esbuild: true

# Install prebuilt binaries for both arches on the host OS, so any platform can package
# either arch (`electron-builder --x64 --arm64`). pnpm does not record
# supportedArchitectures in the node_modules state, so changing it after the first
# install is a silent no-op - run `pnpm install --force` when editing this.
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64
