name: E2E

# Real-provider scenarios make live LLM calls and cost credits, so the suite
# only runs when manually dispatched with the configured credentials. Without
# credentials the real-provider spec skips and only the launch smoke runs.

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    environment: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Credentials reach the tests only through the environment; never echo
      # them into logs and never pass them to the report upload.
      - run: pnpm test:e2e
        env:
          MICO_E2E_API_KEY: ${{ secrets.MICO_E2E_API_KEY }}
          MICO_E2E_OPENAI_BASE_URL: ${{ vars.MICO_E2E_OPENAI_BASE_URL }}
          MICO_E2E_OPENAI_MODEL: ${{ vars.MICO_E2E_OPENAI_MODEL }}
          MICO_E2E_ANTHROPIC_BASE_URL: ${{ vars.MICO_E2E_ANTHROPIC_BASE_URL }}
          MICO_E2E_ANTHROPIC_MODEL: ${{ vars.MICO_E2E_ANTHROPIC_MODEL }}

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
