name: Packaging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  packaged-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            executable: dist/win-unpacked/Mico.exe
            directory: dist/win-unpacked
            archive: dist/Mico-windows-x64.zip
          - os: macos-15
            platform: mac
            arch: arm64
            executable: dist/mac-arm64/Mico.app/Contents/MacOS/Mico
            directory: dist/mac-arm64/Mico.app
            archive: dist/Mico-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The matrix targets the runner's platform/architecture. Reuse the Electron
      # distribution verified during install instead of fetching it a second time.
      - name: Package Windows x64
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win --x64 --dir --publish never -c.electronDist=node_modules/electron/dist
      - name: Package macOS arm64 with ad hoc signing
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac --arm64 --dir --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.electronDist=node_modules/electron/dist
      - name: Smoke test the packaged executable
        shell: bash
        run: pnpm test:e2e --project=packaged-smoke 2>&1 | tee packaging-smoke.log
        env:
          DEBUG: pw:browser
          MICO_E2E_EXECUTABLE_PATH: ${{ github.workspace }}/${{ matrix.executable }}
      # Archive first: upload-artifact does not preserve executable modes or symlinks.
      - name: Archive Windows application
        if: matrix.platform == 'win'
        shell: pwsh
        run: tar.exe -a -c -f '${{ matrix.archive }}' -C dist win-unpacked
      - name: Archive macOS application
        if: matrix.platform == 'mac'
        run: ditto -c -k --sequesterRsrc --keepParent '${{ matrix.directory }}' dist/Mico-macos-arm64.zip
      - name: Upload verified application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mico-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.archive }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaging-failure-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            packaging-smoke.log
            playwright-report/
            test-results/
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
          retention-days: 7
          if-no-files-found: ignore
