name: Typecheck

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable source revision for release validation
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-typecheck-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        if: inputs.ref == ''
        uses: ./.github/actions/select-scope
      - uses: ./.github/actions/setup-workspace
        if: steps.scope.outputs.code != 'false'
      - name: Install dependencies
        if: steps.scope.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - name: Check workspace types
        if: steps.scope.outputs.code != 'false'
        run: pnpm typecheck
