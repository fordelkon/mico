name: Provider checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  real-provider:
    name: Real provider
    runs-on: windows-latest
    timeout-minutes: 20
    environment: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check configured providers
        shell: bash
        run: |
          test -n "$MICO_E2E_API_KEY" || { echo "::error::Configure MICO_E2E_API_KEY in the e2e environment."; exit 1; }
          if [[ -z "$MICO_E2E_OPENAI_BASE_URL" || -z "$MICO_E2E_OPENAI_MODEL" ]] && [[ -z "$MICO_E2E_ANTHROPIC_BASE_URL" || -z "$MICO_E2E_ANTHROPIC_MODEL" ]]; then
            echo "::error::Configure a complete endpoint/model pair in the e2e environment."
            exit 1
          fi
          pnpm test:e2e --project=real-provider
        env:
          MICO_E2E_REAL_PROVIDER: '1'
          MICO_E2E_API_KEY: ${{ secrets.MICO_E2E_API_KEY }}
          MICO_E2E_OPENAI_BASE_URL: ${{ vars.MICO_E2E_OPENAI_BASE_URL }}
          MICO_E2E_OPENAI_MODEL: ${{ vars.MICO_E2E_OPENAI_MODEL }}
          MICO_E2E_ANTHROPIC_BASE_URL: ${{ vars.MICO_E2E_ANTHROPIC_BASE_URL }}
          MICO_E2E_ANTHROPIC_MODEL: ${{ vars.MICO_E2E_ANTHROPIC_MODEL }}
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-real-provider
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
